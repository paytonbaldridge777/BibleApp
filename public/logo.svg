<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" role="img">
  <title>Shepherd — Guided by Scripture</title>
  <desc>Shepherd logo: compass with upright cross needle beside the wordmark</desc>

  <!-- Compass icon -->
  <circle cx="40" cy="40" r="34" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  <circle cx="40" cy="40" r="28" fill="none" stroke="#1e3a5f" stroke-width="0.7" stroke-dasharray="3 4"/>

  <!-- Tick marks -->
  <line x1="40" y1="9"  x2="40" y2="16" stroke="#1e3a5f" stroke-width="1.6"/>
  <line x1="40" y1="64" x2="40" y2="71" stroke="#1e3a5f" stroke-width="1.6"/>
  <line x1="9"  y1="40" x2="16" y2="40" stroke="#1e3a5f" stroke-width="1.6"/>
  <line x1="64" y1="40" x2="71" y2="40" stroke="#1e3a5f" stroke-width="1.6"/>

  <!-- Diagonal ticks -->
  <line x1="16" y1="16" x2="21" y2="21" stroke="#1e3a5f" stroke-width="0.9" opacity="0.35"/>
  <line x1="59" y1="16" x2="64" y2="21" stroke="#1e3a5f" stroke-width="0.9" opacity="0.35"/>
  <line x1="16" y1="64" x2="21" y2="59" stroke="#1e3a5f" stroke-width="0.9" opacity="0.35"/>
  <line x1="59" y1="64" x2="64" y2="59" stroke="#1e3a5f" stroke-width="0.9" opacity="0.35"/>

  <!-- Upright cross needle (north) — long arm above crossbar, short below -->
  <rect x="38.3" y="15" width="3.5" height="15" rx="1" fill="#c9973a"/>
  <rect x="38.3" y="28" width="3.5" height="14" rx="1" fill="#c9973a"/>
  <rect x="32"   y="26" width="16" height="3.5" rx="1" fill="#c9973a"/>

  <!-- South pointer -->
  <polygon points="40,65 37.8,47 42.2,47" fill="#1e3a5f" opacity="0.4"/>

  <!-- Center pivot -->
  <circle cx="40" cy="40" r="3.5" fill="#1e3a5f"/>
  <circle cx="40" cy="40" r="1.6" fill="#c9973a"/>

  <!-- Wordmark -->
  <text x="88" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#1e3a5f" letter-spacing="0.01em">Shepherd</text>
  <text x="89" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c9973a" letter-spacing="0.13em">GUIDED BY SCRIPTURE</text>
</svg>
