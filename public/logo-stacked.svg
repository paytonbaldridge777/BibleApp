<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img">
  <title>Shepherd — Guided by Scripture</title>
  <desc>Shepherd stacked wordmark</desc>

  <!-- Icon centered at (120,72), medallion r=34 -->
  <polygon points="120,24 115,42 120,38 125,42" fill="#c9973a"/>
  <polygon points="120,120 115,104 120,108 125,104" fill="#1e3a5f" opacity="0.45"/>
  <polygon points="168,72 152,68 156,72 152,76" fill="#1e3a5f" opacity="0.45"/>
  <polygon points="72,72 88,68 84,72 88,76" fill="#1e3a5f" opacity="0.45"/>

  <circle cx="120" cy="72" r="34" fill="#f5f0e8" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Cross: vertical y=40..106, crossbar y=52..58, horiz x=100..140, width 6px -->
  <path d="M117,40 L123,40 L123,52 L140,52 L140,58 L123,58 L123,106 L117,106 L117,58 L100,58 L100,52 L117,52 Z" fill="#c9973a"/>
  <circle cx="120" cy="72" r="3" fill="#1e3a5f"/>

  <text x="120" y="152" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1e3a5f" letter-spacing="0.01em">Shepherd</text>
  <text x="120" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c9973a" letter-spacing="0.13em">GUIDED BY SCRIPTURE</text>
</svg>